# Pipeline de despliegue. Se dispara con:
#   gcloud builds submit --config infra/cloudbuild.yaml \
#     --substitutions=_ENV=prod,_REGION=southamerica-east1
substitutions:
  _ENV: dev
  _REGION: southamerica-east1
  _SERVICE: draga-app
  _JOBS_IMAGE: draga-jobs
  _SQL_INSTANCE: draga-pg

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ── 1. Calidad: nada se despliega sin typecheck, lint y tests en verde
  - id: instalar
    name: node:22
    entrypoint: bash
    args:
      - -c
      - corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile

  - id: verificar
    name: node:22
    entrypoint: bash
    waitFor: [instalar]
    args:
      - -c
      - corepack enable && pnpm typecheck && pnpm lint && pnpm test

  # ── 2. Imagen de la aplicación
  - id: build-app
    name: gcr.io/cloud-builders/docker
    waitFor: [verificar]
    args:
      - build
      - -f
      - infra/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/draga/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/draga/${_SERVICE}:latest
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - --build-arg
      - NEXT_PUBLIC_BUILDING_ID=${_BUILDING_ID}
      - .

  # ── 3. Imagen de los jobs
  - id: build-jobs
    name: gcr.io/cloud-builders/docker
    waitFor: [verificar]
    args:
      - build
      - -f
      - infra/Dockerfile.jobs
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/draga/${_JOBS_IMAGE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/draga/${_JOBS_IMAGE}:latest
      - .

  - id: push-app
    name: gcr.io/cloud-builders/docker
    waitFor: [build-app]
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/draga/${_SERVICE}']

  - id: push-jobs
    name: gcr.io/cloud-builders/docker
    waitFor: [build-jobs]
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/draga/${_JOBS_IMAGE}']

  # ── 4. Migraciones ANTES de desplegar la nueva versión
  - id: migrar
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-jobs]
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs deploy draga-migrate-${_ENV} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/draga/${_JOBS_IMAGE}:$SHORT_SHA \
          --region ${_REGION} \
          --service-account draga-jobs@$PROJECT_ID.iam.gserviceaccount.com \
          --set-cloudsql-instances $PROJECT_ID:${_REGION}:${_SQL_INSTANCE}-${_ENV} \
          --set-secrets DATABASE_URL=draga-database-url-${_ENV}:latest \
          --command node_modules/.bin/tsx --args src/db/migrate.ts \
          --max-retries 0 --task-timeout 10m
        gcloud run jobs execute draga-migrate-${_ENV} --region ${_REGION} --wait

  # ── 5. Despliegue de la aplicación
  - id: deploy-app
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-app, migrar]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}-${_ENV}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/draga/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --service-account=draga-app@$PROJECT_ID.iam.gserviceaccount.com
      - --set-cloudsql-instances=$PROJECT_ID:${_REGION}:${_SQL_INSTANCE}-${_ENV}
      - --set-secrets=DATABASE_URL=draga-database-url-${_ENV}:latest,RESEND_API_KEY=draga-resend-key:latest
      - --set-env-vars=NODE_ENV=production,APP_TIMEZONE=America/Montevideo,GCS_BUCKET=draga-${_ENV}-documents,FIREBASE_PROJECT_ID=$PROJECT_ID,NOTIFICATIONS_ENABLED=true
      - --min-instances=0
      - --max-instances=4
      - --cpu=1
      - --memory=1Gi
      - --concurrency=60
      - --timeout=60s
      - --no-allow-unauthenticated

  # ── 6. Jobs programados, con la imagen recién publicada
  - id: deploy-jobs
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [migrar]
    entrypoint: bash
    args:
      - -c
      - |
        for JOB in generate-maintenance-tasks flag-overdue expiry-scan \
                   compute-compliance detect-trends generate-monthly-report \
                   dispatch-outbox auto-close-tickets; do
          gcloud run jobs deploy "draga-$JOB-${_ENV}" \
            --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/draga/${_JOBS_IMAGE}:$SHORT_SHA \
            --region ${_REGION} \
            --service-account draga-jobs@$PROJECT_ID.iam.gserviceaccount.com \
            --set-cloudsql-instances $PROJECT_ID:${_REGION}:${_SQL_INSTANCE}-${_ENV} \
            --set-secrets DATABASE_URL=draga-database-url-${_ENV}:latest,RESEND_API_KEY=draga-resend-key:latest \
            --set-env-vars "JOB_NAME=$JOB,APP_TIMEZONE=America/Montevideo,GCS_BUCKET=draga-${_ENV}-documents,FIREBASE_PROJECT_ID=$PROJECT_ID,NOTIFICATIONS_ENABLED=true" \
            --max-retries 1 --task-timeout 15m
        done

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/draga/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/draga/${_JOBS_IMAGE}:$SHORT_SHA

timeout: 2400s
